<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rick and Morty</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

<!-- HEADER -->
<header class="bg-green-600 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Rick and Morty</h1>
    <a href="favori.html" class="text-xl font-bold text-red-600">Favorites</a>
</header>

<!-- ANA LAYOUT: sidebar + grid yan yana -->
<div class="flex">

    <!-- SOL SIDEBAR: arama -->
    <aside class="w-64 bg-gray-800 p-4 min-h-screen shrink-0">
        <h2 class="text-sm font-bold text-gray-400 uppercase mb-3">Search</h2>
        <input
                id="search-input"
                type="text"
                placeholder="Search Characters..."
                class="w-full bg-gray-700 text-white placeholder-gray-400
               px-4 py-3 rounded-lg outline-none focus:ring-2 focus:ring-green-500"
        />
    </aside>

    <!-- SAĞ: kartlar -->
    <main class="flex-1 p-6">
        <div id="grid"
             class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        </div>
    </main>

</div>

<script src="index.js"></script>
</body>
</html>
